version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: university_access_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-university123}
      POSTGRES_DB: ${POSTGRES_DB:-university_access}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-university}']
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: university_mqtt_broker
    restart: unless-stopped
    ports:
      - '1883:1883'   # MQTT
      - '9001:9001'   # WebSocket (opcional, para debug no browser)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_sub -t "health" -C 1 -W 2 || exit 0']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
